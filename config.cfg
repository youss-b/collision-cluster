# CollisionCluster configuration

dims = 3
universe_size = 10
init_strategy = random
num_particles = 100 

friction = 0.0

framerate = 60
seconds = 15
substeps = 8

# Acceleration toward origin (per unit time^2). Set to 0 to disable.
gravity_to_origin = 1.5

# Per-particle radii are sampled uniformly from [min_radius, max_radius].
# Mass is r^3 (uniform-density sphere; constant absorbed).
min_radius = 0.05
max_radius = 0.5

# Initial angular velocity is uniform per-component in [-max, +max] (rad/s).
max_angular_speed = 5.0

# Per-substep fraction of perpendicular angular velocity blended at a contact.
collision_spin_transfer = 1.9875

# Per-substep multiplicative damping on angular velocity.
angular_friction = 0

write_to_file = true
output_dir = output
